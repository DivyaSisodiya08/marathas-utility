server:
  port: 8080

spring:
  application:
    name: marathas-utility-backend
  servlet:
    session:
      timeout: 30m

github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/github/callback}
    frontend-success-url: ${FRONTEND_SUCCESS_URL:http://localhost:5174/?github=connected}
    personal-token: ${GITHUB_PERSONAL_TOKEN:}

auth:
  auth-mode: ${AUTH_MODE:dummy}
  external-url: ${AUTH_EXTERNAL_URL:https://dev.r53.stratas.net/cm/login}
  external-submit-value: ${AUTH_EXTERNAL_SUBMIT_VALUE:Login}

jenkins:
  base-url: ${JENKINS_BASE_URL:http://devops-jenkins.r53.stratas.net:8080}
  username: ${JENKINS_USERNAME:}
  api-token: ${JENKINS_API_TOKEN:}
  default-job-path: ${JENKINS_DEFAULT_JOB_PATH:deploy/non-prod/us-east-1/stratas-nonprod/dev}
